# Render Blueprint - ReportTool designer WITH database connections (web service running server/index.mjs).
#
# Who may use the databases - choose ONE in the environment variables:
#   REPORTTOOL_PUBLIC=1       anyone, free, no sign-in. Every browser has its own PRIVATE connections: other
#                             visitors cannot see or use them. Only databases on the public internet; no SQLite.
#   REPORTTOOL_PASSWORD=...   a team: people sign in with this password and share one list of connections
#                             (optionally pre-filled with REPORTTOOL_CONNECTIONS, see README).
# With neither, the website refuses database access from the internet.
#
# Your database server must accept connections from Render (Render dashboard > the service > Connect > Outbound).
# Free plan: the service sleeps after 15 minutes without visitors (first visit then ~1 minute) and connections
# added in the designer are kept in memory only; adding one again with the same details reconnects saved reports.

services:
  - type: web
    runtime: node
    name: reporttool-server
    plan: free
    # choose the region closest to your database servers: oregon, ohio, virginia, frankfurt or singapore
    region: singapore
    # --include=dev: the build needs vite / vue-tsc from devDependencies
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: REPORTTOOL_PUBLIC
        value: "1"
